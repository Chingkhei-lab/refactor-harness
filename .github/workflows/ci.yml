name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest -v

  sandbox-hostile:
    # The real-Docker hostile suite must run on a real daemon in CI, not
    # only on the author's machine. ubuntu-latest ships Docker; no Postgres
    # is needed (conftest.py is fixture-lazy, no hostile test touches the
    # DB). The docker SDK is deliberately NOT in the dev extras — the stub
    # suite must keep proving the runner is optional — so it is installed
    # explicitly here.
    runs-on: ubuntu-latest
    env:
      ENGINE_SANDBOX_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "docker>=7.2"
      - name: Verify the daemon is reachable
        run: docker version
      - name: Pre-pull the base image (Docker Hub rate-limit retries)
        run: |
          ok=0
          for i in 1 2 3 4 5; do
            if docker pull python:3.12-slim; then ok=1; break; fi
            echo "pull attempt $i failed; sleeping 30s"; sleep 30
          done
          [ "$ok" = 1 ]
      - name: Hostile sandbox suite (real containers)
        shell: bash
        run: |
          set -o pipefail
          pytest tests/test_sandbox_hostile.py -v -s 2>&1 | tee hostile.log
      - name: Surface failures as check annotations
        if: failure()
        run: |
          # the check-run annotations API is readable without credentials;
          # the raw job log is not — mirror the short summary there
          if grep -qE "^(FAILED|ERROR) " hostile.log; then
            grep -E "^(FAILED|ERROR) " hostile.log | head -25 | while read -r line; do
              echo "::error::${line}"
            done
          else
            echo "::error::hostile suite failed without summary lines; dump: $(tail -c 800 hostile.log | tr '\n' ' ')"
          fi
