name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest -v

  sandbox-hostile:
    # The real-Docker hostile suite must run on a real daemon in CI, not
    # only on the author's machine. ubuntu-latest ships Docker; no Postgres
    # is needed (conftest.py is fixture-lazy, no hostile test touches the
    # DB). The docker SDK is deliberately NOT in the dev extras — the stub
    # suite must keep proving the runner is optional — so it is installed
    # explicitly here.
    runs-on: ubuntu-latest
    env:
      ENGINE_SANDBOX_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "docker>=7.2"
      - name: Verify the daemon is reachable
        run: docker version
      - name: Hostile sandbox suite (real containers)
        run: pytest tests/test_sandbox_hostile.py -v -s
