name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  statuses: write
  issues: write

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest -v -rs --junitxml=junit-ci.xml
      - name: Report test counts in this run page
        if: always()
        run: python scripts/ci_summary.py --job ci junit-ci.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Name the failing tests in an annotation (readable without a token)
        if: failure()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("junit-ci.xml").getroot()
          suite = root if root.tag == "testsuite" else list(root)[0]
          for case in suite.iter("testcase"):
              failure = case.find("failure")
              error = case.find("error")
              if failure is None and error is None:
                  continue
              node = failure if failure is not None else error
              message = (node.get("message") or "").strip().splitlines()
              detail = message[-1][:300] if message else ""
              print(f"::error title={case.get('classname')}::{case.get('name')} {detail}")
          PY
      - name: Publish counts (commit status + tracking-issue comment)
        if: always()
        run: python scripts/ci_status.py --context junit/ci --file junit-ci.xml
          --issue-title "CI reports"
      - name: Publish counts as an annotation (no token needed to read)
        if: always()
        run: |
          text=$(python scripts/ci_status.py --context junit/ci --file junit-ci.xml --dry-run)
          echo "::notice title=junit-ci::$text"
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-ci
          path: junit-ci.xml

  sandbox-hostile:
    # The real-Docker hostile suite must run on a real daemon in CI, not
    # only on the author's machine. ubuntu-latest ships Docker; no Postgres
    # is needed (conftest.py is fixture-lazy, no hostile test touches the
    # DB). The docker SDK is deliberately NOT in the dev extras — the stub
    # suite must keep proving the runner is optional — so it is installed
    # explicitly here.
    runs-on: ubuntu-latest
    env:
      ENGINE_SANDBOX_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "docker>=7.2"
      - name: Verify the daemon is reachable
        run: docker version
      - name: Pre-pull the base image (Docker Hub rate-limit retries)
        run: |
          ok=0
          for i in 1 2 3 4 5; do
            if docker pull python:3.12-slim; then ok=1; break; fi
            echo "pull attempt $i failed; sleeping 30s"; sleep 30
          done
          [ "$ok" = 1 ]
      - name: Hostile sandbox suite (real containers)
        shell: bash
        run: |
          set -o pipefail
          pytest tests/test_sandbox_hostile.py -v -s --junitxml=junit-hostile.xml 2>&1 | tee hostile.log
      - name: Sandbox transport probe (diagnostics)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python scripts/sandbox_probe.py 2>&1 | tee probe.log || true
          while IFS= read -r line; do echo "::notice title=sandbox-probe::$line"; done < <(grep -E '^PROBE' probe.log | head -6)
      - name: Harness sandbox transport (hostile target, CPU kill recovery)
        shell: bash
        run: |
          set -o pipefail
          pytest tests/test_harness_sandbox_hostile.py -v -s             --junitxml=junit-harness-sandbox.xml 2>&1 | tee harness-sandbox.log || {
              while IFS= read -r line; do echo "::error title=harness-sandbox::$line"; done < <(grep -E '^(E |FAILED|assert)' harness-sandbox.log | head -8)
              exit 1
            }
      - name: Fetch the pinned target (hash-checked)
        run: python scripts/fetch_target.py
      - name: Sandbox regression gate (300 mutants, verdicts + bytes)
        shell: bash
        run: |
          set -o pipefail
          # 300 by default: two fixed waits in the transport used to cost 15 s per
          # pass (76 minutes for the sample). With them removed an overhead pass
          # is 0.91 s, so the full seeded sample (7, 139 killed / 161 survived)
          # costs what 60 used to. See docs/results/checkpoint12b-findings-20261120.md.
          python scripts/sandbox_gate.py --mutants "${GATE_MUTANTS:-300}" 2>&1 | tee sandbox-gate.log || {
            # Progress lines are noise; the reason is in the traceback. Grep for it
            # first, then fall back to the tail, so one annotation carries cause.
            grep -E "Traceback|Error|error:|raise |assert " sandbox-gate.log | tail -6 | sed 's/^/::error title=sandbox-gate::/' || true
            while IFS= read -r line; do echo "::error title=sandbox-gate::$line"; done < <(tail -15 sandbox-gate.log)
            exit 1
          }
      - name: Oracle canaries (both targets must pass clean and kill a broken mutant)
        # A second oracle is only worth having if it is alive: this asserts the
        # unmutated tree passes and a known-broken mutant fails, for parse and
        # pycodestyle. Also documents that the pycodestyle sdist ships no
        # `testing/` package, so the oracle uses the pinned tag tarball.
        run: python scripts/oracle_canary.py
      - name: Pin the oracle (tarball hashes, and module identical to the sdist)
        # The suite comes from the tag tarball and the module from the sdist; the
        # only thing that makes that sound is the two module files being byte
        # identical. Fails if either hash or the comparison changes.
        run: python scripts/pin_oracle.py
      - name: Stage-2 case set is not stale
        # The case file is generated from the pinned tree; a stale file would
        # silently compare against inputs the report does not describe.
        run: python scripts/build_cases_stage2.py --check
      - name: Install-hostile suite (real pip + Docker)
        # The 6 install-phase cases used to run only on the author's machine.
        # They belong here: they assert the property the whole cache rests on
        # (a hashed, wheel-only install committed to a derived image that runs
        # OFFLINE), and `--only-binary :all:` makes any sdist-only pin fail
        # loudly rather than silently change the boundary.
        shell: bash
        run: |
          set -o pipefail
          pytest tests/test_install_hostile.py -v -s --junitxml=junit-install-hostile.xml 2>&1 | tee install-hostile.log
      - name: Report test counts in this run page
        if: always()
        run: >-
          python scripts/ci_summary.py --job sandbox-hostile
          junit-hostile.xml junit-install-hostile.xml junit-harness-sandbox.xml
          >> "$GITHUB_STEP_SUMMARY"
      - name: Publish counts (commit status + tracking-issue comment)
        if: always()
        run: python scripts/ci_status.py --context junit/sandbox-hostile
          --file junit-hostile.xml --file junit-install-hostile.xml
          --file junit-harness-sandbox.xml --issue-title "CI reports"
      - name: Publish counts as an annotation (no token needed to read)
        if: always()
        run: |
          text=$(python scripts/ci_status.py --context junit/sandbox-hostile --file junit-hostile.xml --file junit-install-hostile.xml --file junit-harness-sandbox.xml --dry-run)
          echo "::notice title=junit-sandbox-hostile::$text"
      - name: Publish the sandbox gate result as an annotation
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          path = pathlib.Path("docs/results/sandbox-gate-20261120.json")
          if path.exists():
              r = json.loads(path.read_text())
              print(f"::notice title=sandbox-gate::verdicts {r['verdict_agreement']}, "
                    f"byte-identical {r['byte_identical']}, "
                    f"overhead {r['overhead_seconds_per_pass']}s/pass")
          else:
              print("::warning title=sandbox-gate::no gate report written")
          PY
      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-sandbox-hostile
          path: |
            junit-hostile.xml
            junit-install-hostile.xml
      - name: Surface failures as check annotations
        if: failure()
        run: |
          # the check-run annotations API is readable without credentials;
          # the raw job log is not — mirror the short summary there
          for log in hostile.log install-hostile.log; do
            [ -f "$log" ] || continue
            if grep -qE "^(FAILED|ERROR) " "$log"; then
              grep -E "^(FAILED|ERROR) " "$log" | head -25 | while read -r line; do
                echo "::error::${line}"
              done
            else
              echo "::error::${log}: suite failed without summary lines; dump: $(tail -c 800 "$log" | tr '\n' ' ')"
            fi
          done
