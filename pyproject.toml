[project]
name = "refactor-harness"
version = "0.2.1"
description = "Refactor harness"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2", "pydantic>=2.7"]

[project.optional-dependencies]
# `httpx` is for the model bake-off (`scripts/model_router.py`), which is tooling
# rather than shipped library code: without it a bare `.[dev]` install cannot even
# collect tests/test_model_router.py, which is how CI first found out.
dev = [
    "alembic>=1.13",
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "hypothesis>=6",
    "httpx>=0.27",
    "psutil>=5.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.ruff]
target-version = "py312"
# `tests/fixtures/model_bakeoff` is a standalone project used as the bake-off's
# repository: its own layout, its own tests, its own style. Linting it as part of
# this project would edit the thing under measurement.
exclude = ["tests/fixtures/model_bakeoff"]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agent", "engine", "harness"]
mypy_path = "src"

# pywintypes (pywin32) is imported by NAME only, inside a guarded import:
# present on Windows hosts (via the docker SDK), absent elsewhere.
[[tool.mypy.overrides]]
module = "pywintypes"
ignore_missing_imports = true

# The docker SDK ships no stubs and is optional at runtime (the sandbox job
# installs it); scripts that use it are checked, not type-annotated against it.
[[tool.mypy.overrides]]
module = ["docker", "docker.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
